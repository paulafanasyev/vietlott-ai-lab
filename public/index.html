<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vietlott AI Lab</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --ink:#1d2433; --mute:#667085; --line:#e4e7ec; --acc:#4f46e5; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:16px 16px 0; max-width:1040px; margin:auto; }
  h1 { margin:0; font-size:22px; }
  h2 { margin:0 0 6px; font-size:18px; }
  .note { color:var(--mute); font-size:13px; margin-top:4px; }
  .disc { background:#fff1f2; border:1px solid #fecdd3; color:#9f1239; border-radius:12px; padding:10px 12px; margin-top:10px; font-weight:600; }
  nav { max-width:1040px; margin:10px auto 0; padding:0 16px; display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; }
  nav a { flex:none; text-decoration:none; color:var(--ink); background:#eef0f6; border-radius:999px; padding:6px 12px; font-size:13px; white-space:nowrap; }
  nav a.on { background:var(--acc); color:#fff; }
  main { max-width:1040px; margin:auto; padding:4px 16px 40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:12px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  button, a.btn { border:0; border-radius:10px; padding:9px 14px; font:inherit; cursor:pointer; text-decoration:none;
                  background:var(--acc); color:#fff; display:inline-block; }
  a.btn.sec, button.sec { background:#eef0f6; color:var(--ink); }
  button:disabled { opacity:.6; cursor:wait; }
  .tabs button { background:#eef0f6; color:var(--ink); padding:6px 12px; }
  .tabs button.on { background:var(--acc); color:#fff; }
  table { width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; }
  th, td { text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mute); font-weight:600; font-size:12px; }
  .ball { display:inline-block; min-width:26px; padding:2px 0; margin:1px; border-radius:13px; text-align:center;
          background:#eef0f6; font-weight:600; font-variant-numeric:tabular-nums; }
  .ball.b { background:#fde68a; } .ball.h { background:#bbf7d0; }
  .st { font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; white-space:nowrap; }
  .VERIFIED { background:#dcfce7; color:#166534; } .CROSS-CHECKED { background:#dbeafe; color:#1e40af; }
  .NOT-PROVEN { background:#f3f4f6; color:#374151; } .CONFLICT { background:#fee2e2; color:#991b1b; }
  .PENDING { background:#fef9c3; color:#854d0e; }
  .chips span { margin-right:12px; display:inline-block; }
  pre { white-space:pre-wrap; font-size:12px; background:#f8fafc; border-radius:8px; padding:10px; max-height:320px; overflow:auto; }
  .ok { color:#166534; } .bad { color:#991b1b; } .wait { color:#854d0e; }
  .scroll { overflow-x:auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; margin-top:10px; }
  .goals { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-top:10px; }
  .goal { background:#f8fafc; border:1px solid var(--line); border-radius:10px; padding:10px; }
  .goal b { font-size:18px; display:block; }
  .warn { background:#fff7ed; border:1px solid #fed7aa; border-radius:10px; padding:10px; margin-top:10px; font-size:13px; }
  .featured-grid { margin-top:10px; }
  .featured { background:linear-gradient(135deg,#eef2ff,#ffffff); border:2px solid var(--acc); border-radius:14px; padding:14px; min-width:0; }
  .featured-title { font-size:15px; font-weight:750; margin-bottom:6px; }
  .featured-balls { margin:8px 0; }
  .featured-meta { color:var(--mute); font-size:12px; margin-top:6px; }
  .method-heading { margin:14px 0 4px; font-weight:700; }
  section.page { display:none; } section.page.on { display:block; }
  input.q { flex:1; min-width:200px; padding:9px; border:1px solid var(--line); border-radius:10px; font:inherit; }
</style>
</head>

// ---------------------------------------------------------------- xác suất cho một BỘ vé
function setChance(tickets, n) {
  // Mô phỏng Monte Carlo 200 000 kỳ quay: xác suất ít nhất một vé của bộ đạt 3+ / 4+.
  const SIMS = 200000, k = tickets.length, pool = Array.from({length: n}, (_, i) => i + 1), mark = new Uint8Array(n + 1);
  let c3 = 0, c4 = 0;
  for (let s = 0; s < SIMS; s++) {
    for (let i = 0; i < 6; i++) { const j = i + Math.floor(Math.random() * (n - i)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; mark[pool[i]] = 1; }
    let best = 0;
    for (const t of tickets) { let h = 0; for (const x of t) h += mark[x]; if (h > best) best = h; }
    if (best >= 3) c3++; if (best >= 4) c4++;
    for (let i = 0; i < 6; i++) mark[pool[i]] = 0;
  }
  return {k, p3: c3 / SIMS, p4: c4 / SIMS};
}
function comb(n, r) { let x = 1; for (let i = 0; i < r; i++) x = x * (n - i) / (i + 1); return x; }
function pAtLeast(n, m) { let s = 0; for (let j = m; j <= 6; j++) s += comb(6, j) * comb(n - 6, 6 - j) / comb(n, 6); return s; }

// Current display shows the newest saved version of each method.
// Historical versions stay in the database and in prediction history.
function latestMethodTickets(tickets) {
  const byCode = new Map();
  for (const t of (tickets || [])) {
    if (!t || !t.code || !Array.isArray(t.numbers)) continue;
    const old = byCode.get(String(t.code));
    if (!old || Number(t.version || 0) > Number(old.version || 0)) byCode.set(String(t.code), t);
  }
  return [...byCode.values()].sort((a, b) => String(a.code).localeCompare(String(b.code), undefined, {numeric:true}));
}

// Each distinct method gets one vote based on its latest version.
// Ties are broken by number ascending for a deterministic, transparent result.
function unifiedPick(tickets, maxNumber) {
  const methods = latestMethodTickets(tickets);
  const votes = Array(maxNumber + 1).fill(0);
  for (const method of methods) {
    const own = new Set((method.numbers || []).map(Number));
    for (const n of own) if (Number.isInteger(n) && n >= 1 && n <= maxNumber) votes[n]++;
  }
  const numbers = Array.from({length:maxNumber}, (_, i) => i + 1)
    .sort((a, b) => votes[b] - votes[a] || a - b)
    .slice(0, 6).sort((a, b) => a - b);
  return {numbers, votes, methods, methodCount: methods.length};
}

// ---------------------------------------------------------------- 2–3. Dự đoán
async function pPredict(g) {
  setMain(card(T("Dự đoán ") + GN[g], T("<div id='pr' class='note'>Đang tải…</div>"),
    T("Mỗi phương pháp ghi một vé cho kỳ tới TRƯỚC giờ quay (CSDL từ chối vé ghi muộn). Vé được ghi ngay sau khi có kết quả kỳ trước: 3 kỳ mỗi tuần cho mỗi trò chơi.")));
  const [lv, bt] = await Promise.all([api("/api/live?game=" + g), api("/api/backtest?game=" + g)]);
  if (!lv.ok) { $("#pr").innerHTML = err(lv.j); return; }
  const up = (lv.j.draws || []).find(x => !x.result);
  let h = "";
  if (!up) h += T("<div>Vé cho kỳ tới sẽ được ghi ở lần chạy kế tiếp (sau khi có kết quả kỳ vừa quay).</div>");
  else {
    h += T("<div style='font-size:16px;margin-top:6px'>Kỳ <b>") + esc(up.draw_no) + T("</b> · quay lúc <b>") + fmtTime(up.draw_at) + T("</b> · vé ghi lúc ") + fmtTime(up.created_at) + T("</div>");
    h += unifiedPickHtml(g, up);
    h += "<div class='method-heading'>" + T("Dự đoán riêng của từng phương pháp tính toán") + "</div>";
    h += "<div class='note'>" + T("Chỉ hiển thị phiên bản mới nhất của từng phương pháp. Các phiên bản cũ vẫn được giữ trong lịch sử.") + "</div>";
    h += T("<table><tr><th>Phương pháp</th><th>Tổ hợp số</th><th>Cách tính</th></tr>");
    for (const t of latestMethodTickets(up.tickets)) {
      h += "<tr><td><b>" + esc(t.code) + " v" + esc(String(t.version ?? "")) + "</b></td><td>" + balls(t.numbers) + "</td><td class='note'>" + esc(tx(t.explanation_vi)) + "</td></tr>";
    }
    h += T("</table><div id='sc' class='note'>Đang tính xác suất của các phương pháp được hiển thị…</div>");
  }
  const o = lv.j.goal_odds;
  if (o) {
    h += T("<div style='margin-top:12px'><b>Xác suất của MỘT vé bất kỳ</b> (mọi phương pháp như nhau)</div><div class='goals'>");
    for (const k of ["6", "5", "4", "3"]) h += "<div class='goal'><span class='note'>" + (k === "6" ? T("Độc đắc") : T("Đúng ") + k + T(" số")) + T("</span><b>1 trên ") + nf(o[k].one_in) + "</b><span class='note'>" + pct(o[k].p) + "</span></div>";
    h += "</div>";
  }
  if (bt.ok && bt.j.learn_weights) h += T("<div class='note' style='margin-top:10px'>Trọng số tự học M8: ") + Object.entries(bt.j.learn_weights).map(([c, w]) => c + " " + (w * 100).toFixed(1) + "%").join(" · ") + "</div>";
  h += T("<div class='warn'>Chọn số bằng phương pháp nào thì xác suất trúng của mỗi vé vẫn như vé ngẫu nhiên. Bảng kiểm định ở mục 7 cho thấy chưa phương pháp nào khác ngẫu nhiên.</div>");
  $("#pr").innerHTML = h;
  if (up) setTimeout(() => {
    const n = MAXN[g], currentMethods = latestMethodTickets(up.tickets);
    const uniq = [...new Map(currentMethods.map(t => [t.numbers.join(","), t.numbers])).values()];
    const s = setChance(uniq, n), r3 = 1 - Math.pow(1 - pAtLeast(n, 3), s.k), r4 = 1 - Math.pow(1 - pAtLeast(n, 4), s.k);
    const p5 = s.k * pAtLeast(n, 5), p6 = s.k / comb(n, 6);
    $("#sc").innerHTML = T("<div style='margin-top:10px'><b>Bộ ") + s.k + T(" tổ hợp khác nhau từ các phương pháp đang hiển thị</b> (ít nhất một vé đạt), so với ") + s.k + T(" vé ngẫu nhiên:</div><div class='goals'>")
      + T("<div class='goal'><span class='note'>Từ 3 số</span><b>") + pct(s.p3) + T("</b><span class='note'>ngẫu nhiên: ") + pct(r3) + "</span></div>"
      + T("<div class='goal'><span class='note'>Từ 4 số</span><b>") + pct(s.p4) + T("</b><span class='note'>1 trên ") + nf(Math.round(1 / Math.max(s.p4, 1e-9))) + T(" · ngẫu nhiên: ") + pct(r4) + "</span></div>"
      + T("<div class='goal'><span class='note'>Từ 5 số</span><b>1 trên ") + nf(Math.round(1 / p5)) + T("</b><span class='note'>ngẫu nhiên: như nhau</span></div>")
      + T("<div class='goal'><span class='note'>Độc đắc</span><b>1 trên ") + nf(Math.round(1 / p6)) + T("</b><span class='note'>ngẫu nhiên: như nhau</span></div></div>")
      + T("<div class='note'>3+ và 4+: mô phỏng 200 000 kỳ quay (sai số khoảng ±0,2 điểm %); 5+ và độc đắc: công thức chính xác/xấp xỉ.</div>");
  }, 30);
}

function liveDraw(d) {
  let h = T("<div style='margin-top:12px'><b>Kỳ ") + d.draw_no + T("</b> · quay ") + fmtTime(d.draw_at) + T(" · vé ghi ") + fmtTime(d.created_at) + "<br>"

}

    + T("<tr><td><span class='st CONFLICT'>CONFLICT</span></td><td>Các nguồn mâu thuẫn; kỳ này bị loại khỏi mọi tính toán.</td></tr>")

  h += T("<div class='warn'>vietlott.vn chặn máy chủ đặt ngoài Việt Nam (HTTP 403), nên hiện tại các kỳ chỉ đạt CROSS-CHECKED.</div>");
  if (j.runs.length) h += T("<details open><summary>Báo cáo thu thập gần nhất · ") + fmtTime(j.runs[0].finished_at) + "</summary><pre>" + esc(j.runs[0].summary_vi) + "</pre></details>";
  $("#src").innerHTML = h;
}

// ---------------------------------------------------------------- 11. Biểu đồ
function bars(rows, ref, fmt, title) {
  const W = 640, rowH = 26, H = rows.length * rowH + 30, max = Math.max(ref, ...rows.map(r => r.v)) * 1.15, x = v => 90 + v / max * (W - 160);
  let s = "<svg viewBox='0 0 " + W + " " + H + "' width='100%' style='max-width:" + W + "px'><text x='0' y='14' font-size='13' font-weight='600'>" + esc(title) + "</text>";
  rows.forEach((r, i) => {
    const y = 24 + i * rowH;
    s += "<text x='0' y='" + (y + 15) + "' font-size='12'>" + esc(r.label) + "</text><rect x='90' y='" + (y + 3) + "' width='" + Math.max(1, x(r.v) - 90) + "' height='16' rx='4' fill='#818cf8'/>"
       + "<text x='" + (x(r.v) + 4) + "' y='" + (y + 15) + "' font-size='11' fill='#475467'>" + fmt(r.v) + "</text>";
  });
  s += "<line x1='" + x(ref) + "' x2='" + x(ref) + "' y1='22' y2='" + (H - 4) + "' stroke='#dc2626' stroke-dasharray='4 3'/><text x='" + (x(ref) + 3) + "' y='" + (H - 6) + T("' font-size='11' fill='#dc2626'>ngẫu nhiên ") + fmt(ref) + "</text></svg>";
  return s;
}
async function pCharts() {
  setMain(card(T("Biểu đồ hiệu quả"), gameTabs(pCharts) + T("<div id='ch' class='note'>Đang tính…</div>"), T("Đường đỏ: mức kỳ vọng của vé ngẫu nhiên. Thanh dài hơn chưa chắc là tốt hơn: xem kết luận thống kê ở mục 7.")));
  const {ok, j} = await api("/api/backtest?game=" + game);
  if (!ok) { $("#ch").innerHTML = err(j); return; }
  if (!j.methods) { $("#ch").textContent = T("Chưa có dữ liệu."); return; }
  const ms = j.methods;
  let h = bars(ms.map(m => ({label: m.code, v: m.mean_hits})), ms[0].random_mean_hits, v => v.toFixed(3), T("Số trúng trung bình mỗi vé (") + nf(ms[0].draws) + T(" kỳ)"));
  h += bars(ms.map(m => ({label: m.code, v: m.goals["3"].actual_rate})), ms[0].goals["3"].random_rate, v => (v * 100).toFixed(2) + "%", T("Tỷ lệ vé đạt từ 3 số"));
  h += bars(ms.map(m => ({label: m.code, v: m.goals["4"].actual_rate})), ms[0].goals["4"].random_rate, v => (v * 100).toFixed(3) + "%", T("Tỷ lệ vé đạt từ 4 số"));
  $("#ch").innerHTML = h;
}

// ---------------------------------------------------------------- 12. Tự động hóa
async function pAutoSettings() {
  setMain(card(T("Cài đặt tự động hóa"), T("<div id='as' class='note'>Đang tải…</div>")));
  const {ok, j} = await api("/api/automation");
  if (!ok) { $("#as").innerHTML = err(j); return; }
  let h = "<div style='margin-top:6px'>" + esc(T(j.schedule_vi)) + T("</div><table><tr><th>Lịch</th><th>Giờ Việt Nam</th><th>Việc</th></tr>")
    + T("<tr><td>Vercel Cron /api/cron</td><td>hằng ngày ~19:45</td><td>thu thập sau giờ quay 18:00, chấm vé, ghi vé kỳ tới, giả thuyết, báo cáo</td></tr>")
    + T("<tr><td>Vercel Cron /api/cron-morning</td><td>hằng ngày ~07:00</td><td>thu thập lại kết quả công bố muộn, các bước như trên</td></tr>")
    + T("<tr><td>Sao lưu + thử khôi phục</td><td>mỗi ngày một lần (cách nhau ≥ 20 giờ)</td><td>trong lần chạy đầu tiên của ngày</td></tr>")
    + T("<tr><td>Báo cáo tuần</td><td>mỗi 7 ngày</td><td>tóm tắt kỳ, vé live, giả thuyết, tác vụ, sao lưu</td></tr>")
    + T("<tr><td>Chạy tay</td><td>bất kỳ lúc nào, cách lần trước ≥ 10 phút</td><td>nút bên dưới</td></tr></table>")
    + T("<div class='note'>Không có thông báo (theo quyết định 16.10): trang tự cập nhật sau mỗi lần chạy. Gói Vercel miễn phí có thể lệch giờ chạy trong phạm vi một giờ.</div>")
    + T("<div class='row' style='margin-top:10px'><button id='run'>Chạy thu thập ngay</button></div>");
  $("#as").innerHTML = h;
  $("#run").onclick = async () => {
    const b = $("#run"); b.disabled = true; b.textContent = T("Đang chạy… (tới 5 phút)");
    const {ok, j} = await api("/api/cron?manual=1", true);
    b.disabled = false; b.textContent = T("Chạy thu thập ngay");
    for (const k in cache) delete cache[k];
    alert(ok ? [j.live_vi, j.research_vi, j.report_vi, j.backup_vi].filter(Boolean).join("\n") : (j.error_vi || T("Lỗi")));
  };
}

// ---------------------------------------------------------------- 13. Nhật ký
async function pLog() {
  setMain(card(T("Nhật ký hoạt động và lỗi"), T("<div id='lg' class='note'>Đang tải…</div>"), T("20 tác vụ gần nhất (job_runs, chỉ ghi thêm). Bấm vào dòng để xem chi tiết.")));
  const {ok, j} = await api("/api/automation");
  if (!ok) { $("#lg").innerHTML = err(j); return; }
  let h = "";
  for (const r of j.jobs) {
    const c = r.status === "failed" ? "bad" : r.status === "success" ? "ok" : "wait";
    h += "<details><summary>#" + r.id + " · " + (JOBN[r.job_name] || esc(r.job_name)) + " · " + fmtTime(r.started_at) + " · " + (r.trigger === "schedule" ? T("theo lịch") : r.trigger === "manual" ? T("chạy tay") : esc(r.trigger))
       + T(" · <span class='") + c + "'>" + (RUN[r.status] || r.status) + "</span></summary><pre>" + esc(r.summary_vi) + "</pre></details>";
  }
  h += T("<div style='margin-top:12px'><b>Báo cáo</b></div>");
  for (const r of j.reports) h += "<details><summary>" + (r.kind === "weekly" ? T("Báo cáo tuần") : T("Sau kỳ ") + (GN[r.game] || "") + " " + String(r.draw_no).padStart(5, "0")) + " · " + fmtTime(r.created_at) + "</summary><pre>" + esc(r.content_vi) + "</pre></details>";
  if (!j.reports.length) h += T("<div class='note'>Chưa có báo cáo.</div>");
  $("#lg").innerHTML = h;
}

// ---------------------------------------------------------------- 14. Sao lưu
async function pBackup() {
  setMain(card(T("Sao lưu và xuất dữ liệu"), T("<div class='row' style='margin-top:8px'><a class='btn' href='/api/backup'>Tải bản sao lưu đầy đủ (.json.gz)</a></div>")
    + T("<div class='note'>Tệp chứa toàn bộ bảng lịch sử và băm SHA-256 của từng bảng, nên có thể kiểm tra lại bất cứ lúc nào. Nên tải về và cất ở nơi khác định kỳ.</div><div id='bk' class='note'>Đang tải…</div>"))
    + card(T("Xuất dữ liệu"), T("<div class='row' style='margin-top:8px'><a class='btn sec' href='/api/export?kind=draws&format=csv'>Kết quả (CSV)</a><a class='btn sec' href='/api/export?kind=draws&format=json'>Kết quả (JSON)</a>")
    + T("<a class='btn sec' href='/api/export?kind=history&format=csv'>Lịch sử phiên bản</a><a class='btn sec' href='/api/export?kind=observations&format=csv'>Quan sát từ các nguồn</a><a class='btn sec' href='/api/export?kind=conflicts&format=csv'>Xung đột</a></div>"),
    T("Toàn bộ lịch sử chỉ được ghi thêm, không bao giờ sửa hay xóa.")));
  const {ok, j} = await api("/api/automation");
  if (!ok) { $("#bk").innerHTML = err(j); return; }
  let h = T("<table><tr><th>Bản</th><th>Thử khôi phục</th></tr>");
  for (const b of j.backups) h += "<tr><td>#" + b.id + " · " + fmtTime(b.created_at) + " · " + Math.round(b.size_bytes / 1024) + " KB<br><span class='note'>sha256 " + esc(b.sha256.slice(0, 16)) + T("…</span></td><td class='") + (b.restore_ok ? "ok" : "bad") + "'>"
    + (b.restore_ok ? T("ĐẠT") : T("KHÔNG ĐẠT")) + "<br><span class='note'>" + esc(b.details_vi) + "</span></td></tr>";
  if (!j.backups.length) h += T("<tr><td colspan='2'>Chưa có bản sao lưu.</td></tr>");
  $("#bk").innerHTML = h + "</table>";
}

// ---------------------------------------------------------------- định tuyến
$("#nav").innerHTML = PAGES.map(([id, name]) => "<a href='#" + id + "' data-id='" + id + "'>" + name + "</a>").join("");
function go() {
  const id = location.hash.slice(1) || "tong-quan", p = PAGES.find(x => x[0] === id) || PAGES[0];
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.id === p[0]));
  window.scrollTo(0, 0);
  p[2]();
}
window.addEventListener("hashchange", go);
go();
</script>
